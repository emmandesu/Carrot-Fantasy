plugins { id 'com.android.application' }

android {
    namespace 'com.emmandesu.carrotfantasy'
    compileSdk 36
    ndkVersion '23.2.8568313'
    buildFeatures { aidl true; buildConfig false }
    defaultConfig {
        applicationId 'com.emmandesu.carrotfantasy'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static'; targets 'carrotfantasy' }
        }
    }
    sourceSets {
        main {
            java.srcDirs += '../../cocos2d/cocos/platform/android/java/src'
            aidl.srcDirs += '../../cocos2d/cocos/platform/android/java/src'
            assets.srcDirs = ['../../Resources']
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation fileTree(dir: '../../cocos2d/cocos/platform/android/java/libs', include: ['*.jar'])
}
